*{box-sizing:border-box}
body{margin:0;background:#eef5ff;color:#26354a;font-family:Arial,sans-serif;padding-top:env(safe-area-inset-top,0)}
.app{max-width:1100px;margin:auto;min-height:100vh;padding:18px}
header{background:linear-gradient(135deg,#fff,#e8f2ff);border-radius:24px;padding:18px 24px;box-shadow:0 8px 25px #0001;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
h1{margin:0;color:#d62828;font-size:clamp(22px,4vw,36px)}
.sub{margin:5px 0 0;color:#617086}
.progress{height:10px;background:#dce5f1;border-radius:99px;overflow:hidden;margin-top:14px}
.progress i{display:block;height:100%;width:0%;background:#d62828;transition:.3s}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:14px;padding:11px 15px;font-weight:700;cursor:pointer;font-family:Arial,sans-serif}
.tool{background:white;border:1px solid #d6e0eb}
.lettersRow{display:flex;align-items:center;gap:8px}
.scrollBtn{flex:0 0 auto;background:#3975a7;color:#fff;border:2px solid #2c5f89;width:38px;height:48px;font-size:18px;border-radius:10px}
.letters{display:flex;gap:10px;overflow:auto;padding:14px 2px;scrollbar-width:none}
.letters::-webkit-scrollbar{display:none}
.letters button{min-width:90px;height:90px;background:#3975a7;color:#fff;border:3px solid #2c5f89;font-family:PrimeiroCiclo,cursive;font-size:48px;position:relative}
.letters .on{background:#d62828;border-color:#a81f1f;color:white}
.letters button.done:after{content:'✓';position:absolute;top:-6px;right:-6px;background:#4caf7d;color:#fff;border-radius:50%;width:22px;height:22px;font-size:14px;display:flex;align-items:center;justify-content:center}
.card{margin-top:6px;background:white;border-radius:26px;padding:22px;box-shadow:0 10px 30px #0001}
.stagebar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.stagebtn{background:#edf3fa;color:#26354a;font-size:20px;padding:16px 24px;border-radius:16px}
.stagebtn.on{background:#245bdb;color:#fff}
.stagebtn.done{background:#e8f7ee;color:#2e7d51}
.lesson{display:grid;grid-template-columns:240px 1fr;gap:22px}
.model{background:#f7faff;border:3px dashed #b9cbe1;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:330px}
.label{font-weight:800;color:#65758a;font-size:13px;letter-spacing:.5px}
.modelimg{width:120px;height:120px;border-radius:16px;background:#f7faff;border:3px dashed #b9cbe1;display:flex;align-items:center;justify-content:center;font-size:44px;margin-bottom:4px;overflow:hidden}
.modelimg img{width:100%;height:100%;object-fit:contain}
.word{font-size:16px;color:#65758a;text-align:center;font-weight:700}
.letter{font-family:PrimeiroCiclo,cursive;font-size:190px;line-height:1;color:#d62828}
.tip{font-size:17px;text-align:center;margin:8px 15px}
h2{margin:0 0 12px}
.writing{position:relative;border-radius:20px;overflow:hidden;background:repeating-linear-gradient(to bottom,#fff 0 106px,#b9d5ee 106px 108px);border:2px solid #d8e5f1;padding:12px 18px}
.writing:before,.writing:after{content:"";position:absolute;top:0;bottom:0;border-left:2px solid #f3a3a3;opacity:.7}
.writing:before{left:38px}
.writing:after{right:38px}
.traceline{font-family:PrimeiroCiclo,cursive;font-size:135px;line-height:108px;color:#9bb3cc;letter-spacing:34px;white-space:nowrap;overflow:hidden;user-select:none;pointer-events:none;position:relative;z-index:1;padding-left:32px}
.tracado .traceline{color:transparent;-webkit-text-stroke:2px #9bb3cc}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none;cursor:crosshair}
.hint{margin-top:10px;background:#fff6d8;border-radius:14px;padding:12px 15px;font-weight:600;font-size:14px}
.controls{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.nav{background:#d62828;color:white;font-size:20px;padding:16px 24px;border-radius:18px}
.nav:disabled{opacity:.45;cursor:not-allowed}
.writesheet{border:3px solid #d8e5f1;border-radius:18px;padding:14px;background:#fff}
.dline{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
.dcell{position:relative;height:88px;border:2px solid #b9cbe1;border-radius:12px;background:linear-gradient(to bottom,transparent 0 29%,#f1a7a7 30% 31%,transparent 32% 65%,#a8c9df 66% 68%,transparent 69%)}
.dcell input{position:absolute;inset:0;width:100%;height:100%;border:0;outline:0;background:transparent;text-align:center;font-family:PrimeiroCiclo,cursive;font-size:48px;color:#245bdb;caret-color:#d62828}
.dcell.correct{background-color:#e8f9ec;border-color:#55bd78}
.dcell.wrong{animation:shake .22s;border-color:#e66a6a;background-color:#fff0f0}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.dmsg{min-height:26px;text-align:center;font-weight:700;margin-top:10px;font-size:15px}
.dmsg.success{color:#299653}
.dmsg.try{color:#df6262}
#overlay{position:fixed;inset:0;background:#00000060;display:none;align-items:center;justify-content:center;z-index:20}
#overlay.show{display:flex}
#overlayCard{background:#fff;border-radius:22px;padding:30px 34px;text-align:center;max-width:320px}
#overlayCard .big{font-size:2.6rem;margin-bottom:8px}
footer{text-align:center;padding:18px;color:#708096;font-size:13px}
@media(max-width:760px){.lesson{grid-template-columns:1fr}.model{min-height:220px}.letter{font-size:140px}.traceline{font-size:92px;line-height:74px;letter-spacing:22px}.letters button{min-width:64px;height:64px;font-size:30px}}
</style></head><body>
<div class="app">
<header>
  <div>
    <h1>✏️ Caderno Digital — Alfabeto</h1>
    <p class="sub">Vamos aprender a escrever com a letra do Primeiro Ciclo — vogais e consoantes.</p>
    <div class="progress"><i id="bar"></i></div>
  </div>
  <div class="tools">
    <button class="tool" onclick="clearCanvas()">🧹 Limpar</button>
    <button class="tool" onclick="toggleFullscreen()">⛶ Ecrã inteiro</button>
  </div>
</header>
<div class="lettersRow">
  <button id="scrollLeft" class="scrollBtn">◀</button>
  <div class="letters" id="letters"></div>
  <button id="scrollRight" class="scrollBtn">▶</button>
</div>
<main class="card">
  <div class="stagebar" id="stagebar"></div>
  <div class="lesson">
    <section class="model">
      <div class="label">LETRA DO DIA</div>
      <div class="modelimg" id="modelimg">🖼️</div>
      <div id="letter" class="letter">i</div>
      <div id="word" class="word"></div>
      <div id="name" class="tip">i minúsculo</div>
    </section>
    <section>
      <h2 id="title">Copia a letra</h2>
      <div class="writing writearea" id="writing">
        <div id="trace"></div>
        <canvas id="canvas"></canvas>
      </div>
      <div id="boxwrap" style="display:none">
        <div class="writesheet" id="sheet"></div>
        <div class="dmsg" id="dmsg"></div>
      </div>
      <div class="hint" id="hint">👆 Passa o dedo ou usa o rato para escrever por cima das letras-guia.</div>
      <div class="controls">
        <button class="nav" id="prev" onclick="prevLetter()">← Letra anterior</button>
        <button class="nav" id="stageAction" onclick="stageAction()">✅ Concluí</button>
        <button class="nav" id="next" onclick="nextLetter()">Próxima letra →</button>
      </div>
    </section>
  </div>
</main>
<footer>Primeiro Ciclo • Caderno Digital de Escrita • 1.º Ano</footer>
</div>

<div id="overlay"><div id="overlayCard">
  <div class="big">⭐</div>
  <div id="overlayText" style="font-weight:700;margin-bottom:16px"></div>
  <button style="background:#d62828;color:#fff;padding:10px 20px" onclick="closeOverlay()">Continuar</button>
</div></div>

<script>
const letters=['i','I','u','U','a','A','o','O','e','E','p','P','t','T','l','L','d','D','m','M','v','V','n','N','r','R','c','C','q','Q','b','B','g','G','f','F','j','J','s','S','z','Z','h','H','x','X'];
// Palavra-chave de cada letra (podes alterar as palavras aqui)
const WORDS={i:'ilha',u:'uva',a:'anel',o:'ovo',e:'elefante',p:'pato',t:'tatu',l:'lua',d:'dado',m:'mala',v:'vaca',n:'nariz',r:'rato',c:'casa',q:'queijo',b:'bola',g:'gato',f:'foca',j:'jarro',s:'sapo',z:'zebra',h:'hipopótamo',x:'xadrez'};
// Aqui entram as imagens: caminho relativo à pasta "images" ao lado do ficheiro HTML.
// Cria uma pasta chamada "images" e coloca lá os ficheiros com estes nomes:
const IMAGES={};
Object.keys(WORDS).forEach(k => IMAGES[k] = 'images/' + WORDS[k] + '.png');
const KEY='vogais-primeiro-ciclo-v1';
let n=0, stage=0; // 0 treino,1 tracado,2 desafio
let progress=JSON.parse(localStorage.getItem(KEY)||'{}');
let drawing=false, canvas, ctx;
let drawings={}; // guarda o desenho de cada letra+etapa durante a sessão
let challengeTarget='', challengeDone=0, challengeTotal=0;
let challengeData={}; // guarda o que já foi escrito certo em cada letra
const CELLS_PER_LINE=4, LINES=3;

function saveProg(){localStorage.setItem(KEY,JSON.stringify(progress))}
function getProg(i){return progress[i]||{0:false,1:false,2:false}}
function setProg(i,s,v){const p=getProg(i);p[s]=v;progress[i]=p;saveProg()}
function letterDone(i){const p=getProg(i);return p[0]&&p[1]&&p[2]}
function totalPct(){let done=0;letters.forEach((_,i)=>{const p=getProg(i);done+=(p[0]?1:0)+(p[1]?1:0)+(p[2]?1:0)});return done/(letters.length*3)*100}

function buildLetterStrip(){
  const wrap=document.getElementById('letters');wrap.innerHTML='';
  letters.forEach((x,i)=>{
    const b=document.createElement('button');
    b.textContent=x;
    b.className=(i===n?'on ':'')+(letterDone(i)?'done':'');
    b.onclick=()=>{n=i;stage=0;render()};
    wrap.appendChild(b);
  });
}
function buildStageBar(){
  const wrap=document.getElementById('stagebar');wrap.innerHTML='';
  const labels=['✏️ TREINO','🖱️ Traçado','⌨️ DESAFIO'];
  labels.forEach((t,i)=>{
    const b=document.createElement('button');
    b.className='stagebtn'+(i===stage?' on':'')+(getProg(n)[i]?' done':'');
    b.textContent=t;
    b.onclick=()=>{stage=i;render()};
    wrap.appendChild(b);
  });
}

function fit(){
  const r=canvas.parentElement.getBoundingClientRect(),d=devicePixelRatio||1;
  canvas.width=r.width*d;canvas.height=r.height*d;
  canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';
  ctx.setTransform(d,0,0,d,0,0);
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle='#245bdb';
  ctx.lineWidth = stage===1 ? 8 : 6;
}
function clearCanvas(){ if(!ctx) return; ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight); delete drawings[keyFor()]; }
function pos(e){const r=canvas.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}

function render(){
  buildLetterStrip();
  buildStageBar();
  document.getElementById('bar').style.width=totalPct()+'%';
  document.getElementById('prev').disabled = (n===0);
  document.getElementById('next').disabled = (n===letters.length-1);
  const x=letters[n];
  document.getElementById('letter').textContent=x;
  document.getElementById('name').textContent=(x===x.toUpperCase()?'Maiúscula':'Minúscula')+' — letra '+x.toLowerCase();
  const base=x.toLowerCase();
  const w=WORDS[base]||'';
  document.getElementById('word').textContent=w?(base+' de '+w):'';
  const imgBox=document.getElementById('modelimg');
  imgBox.innerHTML = IMAGES[base] ? `<img src="${IMAGES[base]}" alt="${w}" onerror="this.parentElement.textContent='🖼️'">` : '🖼️';

  const writing=document.getElementById('writing');
  const boxwrap=document.getElementById('boxwrap');
  const title=document.getElementById('title');
  const hint=document.getElementById('hint');
  const stageAction=document.getElementById('stageAction');

  writing.classList.remove('tracado','treino');

  if(stage===0){
    title.textContent='✏️ TREINO — copia a letra';
    writing.style.display='block'; boxwrap.style.display='none';
    writing.classList.add('treino');
    buildTraceLines(x);
    hint.textContent='👆 Passa o dedo ou usa o rato por cima das letras-guia nas primeiras linhas. Depois, continua a escrever sozinho nas linhas seguintes.';
    stageAction.textContent='✅ Concluí o treino';
    setupCanvas();
  } else if(stage===1){
    title.textContent='🖱️ Traçado — usa um traço mais grosso, com calma';
    writing.style.display='block'; boxwrap.style.display='none';
    writing.classList.add('tracado');
    buildTraceLines(x);
    hint.textContent='🖊️ Agora com um traço mais grosso — segue o contorno devagar nas primeiras linhas e depois continua sozinho.';
    stageAction.textContent='✅ Concluí o traçado';
    setupCanvas();
  } else {
    title.textContent='⌨️ DESAFIO — escreve a letra "'+x+'"';
    writing.style.display='none'; boxwrap.style.display='block';
    hint.textContent='Escreve a letra "'+x+'" nas casinhas, usando o teclado do computador.';
    stageAction.textContent='✅ Concluí';
    buildChallenge(x);
  }
}
function keyFor(){ return n+'_'+stage; }
function saveDrawing(){ if(!canvas) return; drawings[keyFor()]=canvas.toDataURL(); }
function restoreDrawing(){
  const data=drawings[keyFor()];
  if(!data) return;
  const img=new Image();
  img.onload=()=>{ ctx.drawImage(img,0,0,canvas.clientWidth,canvas.clientHeight); };
  img.src=data;
}
function buildTraceLines(letter){
  const trace=document.getElementById('trace');
  trace.innerHTML='';
  for(let i=0;i<4;i++){
    const line=document.createElement('div');
    line.className='traceline';
    line.textContent=(letter+' ').repeat(6);
    trace.appendChild(line);
  }
  for(let i=0;i<4;i++){
    const blank=document.createElement('div');
    blank.className='traceline';
    blank.textContent='\u00A0';
    trace.appendChild(blank);
  }
}
function setupCanvas(){
  canvas=document.getElementById('canvas');
  ctx=canvas.getContext('2d');
  canvas.onpointerdown=e=>{drawing=true;canvas.setPointerCapture(e.pointerId);const [x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y)};
  canvas.onpointermove=e=>{if(!drawing)return;const [x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke()};
  canvas.onpointerup=()=>{drawing=false;saveDrawing()};
  canvas.onpointercancel=()=>{drawing=false;saveDrawing()};
  fit();
  restoreDrawing();
}
function buildChallenge(letter){
  challengeTarget=letter; challengeTotal=CELLS_PER_LINE*LINES;
  if(!challengeData[n]) challengeData[n]={values:Array(challengeTotal).fill(''),done:0};
  challengeDone=challengeData[n].done;
  const sheet=document.getElementById('sheet'); sheet.innerHTML='';
  let idx=0;
  for(let r=0;r<LINES;r++){
    const row=document.createElement('div'); row.className='dline';
    for(let c=0;c<CELLS_PER_LINE;c++){
      const i=idx; idx++;
      const cell=document.createElement('div'); cell.className='dcell';
      const inp=document.createElement('input');
      inp.maxLength=1; inp.autocomplete='off'; inp.spellcheck=false;
      inp.setAttribute('aria-label','Escrever '+letter);
      if(challengeData[n].values[i]===letter){ inp.value=letter; cell.classList.add('correct'); }
      inp.addEventListener('input',()=>checkCell(inp,cell,letter,i));
      inp.addEventListener('keydown',e=>{
        if(e.key==='Enter'||e.key===' '){ e.preventDefault(); focusNext(inp); }
      });
      cell.appendChild(inp); row.appendChild(cell);
    }
    sheet.appendChild(row);
  }
  const dmsg=document.getElementById('dmsg'); dmsg.textContent=''; dmsg.className='dmsg';
  setTimeout(()=>{
    const inputs=[...sheet.querySelectorAll('input')];
    const firstEmpty=inputs.find(inp=>!inp.value);
    (firstEmpty||inputs[inputs.length-1])?.focus();
  },150);
}
function focusNext(inp){
  const all=[...document.querySelectorAll('#sheet input')];
  const i=all.indexOf(inp);
  if(i<all.length-1) all[i+1].focus();
}
function checkCell(inp,cell,target,i){
  const dmsg=document.getElementById('dmsg');
  if(inp.value===target){
    if(!cell.classList.contains('correct')){
      cell.classList.remove('wrong'); cell.classList.add('correct');
      challengeDone++; challengeData[n].values[i]=target; challengeData[n].done=challengeDone;
    }
    dmsg.textContent='Muito bem! ⭐'; dmsg.className='dmsg success';
    const all=[...document.querySelectorAll('#sheet input')];
    const idx=all.indexOf(inp);
    if(idx<all.length-1){ setTimeout(()=>all[idx+1].focus(),100); }
    else if(challengeDone===challengeTotal){ setTimeout(()=>stageAction(),500); }
  } else {
    cell.classList.remove('correct'); cell.classList.add('wrong');
    dmsg.textContent='Tenta escrever: '+target; dmsg.className='dmsg try';
    inp.value='';
    setTimeout(()=>cell.classList.remove('wrong'),300);
  }
}

function stageAction(){
  setProg(n,stage,true);
  if(stage<2){ stage++; render(); }
  else {
    if(n<letters.length-1){
      showOverlay('Muito bem! Completaste o "'+letters[n]+'"!', ()=>{n++;stage=0;render()});
    } else {
      showOverlay('🎉 Parabéns! Completaste o caderno das vogais!', ()=>{n=0;stage=0;render()});
    }
  }
}
function prevLetter(){ if(n>0){n--;stage=0;render()} }
function nextLetter(){ if(n<letters.length-1){n++;stage=0;render()} }
function showOverlay(text,cb){document.getElementById('overlayText').textContent=text;document.getElementById('overlay').classList.add('show');window._cb=cb}
function closeOverlay(){document.getElementById('overlay').classList.remove('show'); if(window._cb) window._cb()}
function toggleFullscreen(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen() }
window.addEventListener('resize',()=>{ if(canvas){fit();restoreDrawing()} });
document.getElementById('scrollLeft').onclick=()=>document.getElementById('letters').scrollBy({left:-260,behavior:'smooth'});
document.getElementById('scrollRight').onclick=()=>document.getElementById('letters').scrollBy({left:260,behavior:'smooth'});

render();
</script>
</body></html>
